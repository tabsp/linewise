baseURL = "https://example.com"
locale = "en"
title = "Linewise"
theme = "linewise"

[taxonomies]
tag = "tags"

[params.linewise]
description = "A Vim-inspired Hugo theme for personal blogs."
author = "tabsp"
locale = "en"
favicon = "favicon.svg"
ogImage = "og.svg"
showExplorer = true
showBufferline = true

[params.linewise.comments]
provider = "none"

[outputs]
home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
mediaType = "application/json"
baseName = "search"
isPlainText = true

[module]
[module.hugoVersion]
extended = true
min = "0.146.0"

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
