<p class="post-meta">
  {{ with .Date }}<span>{{ . | time.Format ":date_medium" }}</span>{{ end }}
  {{ with .ReadingTime }}<span>{{ . }} min read</span>{{ end }}
  {{ if and .Lastmod (ne (.Lastmod.Format "2006-01-02") (.Date.Format "2006-01-02")) }}
    <span>updated {{ .Lastmod | time.Format ":date_medium" }}</span>
  {{ end }}
</p>
